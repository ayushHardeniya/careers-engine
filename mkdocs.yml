theme:
  name: material
  language: en

  logo: assets/logo.svg
  favicon: assets/favicon.png

  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.path

    - search.highlight

    - content.code.copy
    - content.action.edit

    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md

  - Getting Started:
      - Installation: getting-started/installation.md

  - Developer Guide:
      - Contributing: developer-guide/contributing.md
