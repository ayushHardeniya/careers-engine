site_name: careers-engine
site_description: Intelligent job aggregation and publishing platform powering ZenYukti Jobs.
site_url: https://careers-engine.zenyukti.in

repo_name: ZenYukti/careers-engine
repo_url: https://github.com/ZenYukti/careers-engine
edit_uri: edit/main/docs/

copyright: Copyright © 2026 ZenYukti

